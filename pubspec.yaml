name: xinyu_os
publish_to: none
description: 心屿 OS — 跨平台 AI 虚拟手机（本地优先）
version: 4.4.0+18

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  android_id: ^0.5.2+1
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.2
  path_provider: '>=2.1.5 <2.1.6'
  just_audio: ^0.10.6
  video_player: 2.11.1
  flutter_markdown_plus: ^1.0.12
  archive: '>=4.0.9 <4.1.0'
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  shared_preferences: 2.5.5
  record: ^6.2.1
  speech_to_text: 7.4.0
  flutter_tts: 4.2.5
  sherpa_onnx: 2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # CI downloads the offline ASR model files into assets/sherpa/ before
  # `flutter build`; see android-build.yml. Local builds without the files
  # simply fall back to system speech recognition.
  assets:
    - assets/sherpa/
