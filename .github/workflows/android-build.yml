name: 生成心屿OS正式签名 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'test/**'
      - 'tools/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        # ubuntu runners ship ~14GB free; sherpa_onnx pulls native libs for
        # every platform, so drop preinstalled toolchains we never use.
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/emulator \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android project
        run: flutter create --platforms=android --project-name=xinyu_os --org=com.xinyuos .
      - name: Fetch Gradle locally and point the wrapper at the file
        # Ultimate fix for flaky wrapper downloads: WE download Gradle with
        # curl (official CDN -> Tencent mirror, with retries) and rewrite
        # distributionUrl to a file:// URL, so the wrapper never touches
        # GitHub (whose release CDN 504s) or any network at all.
        run: |
          set -e
          WRAP=android/gradle/wrapper/gradle-wrapper.properties
          VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-(all|bin)\.zip' "$WRAP" | head -1 | sed 's/^gradle-//; s/\.zip$//')
          echo "Detected Gradle: $VER"
          test -n "$VER" || { echo 'no version found'; cat "$WRAP"; exit 1; }
          ZIP=/tmp/gradle-$VER.zip
          for URL in "https://services.gradle.org/distributions/gradle-$VER.zip" \
                     "https://mirrors.cloud.tencent.com/gradle/gradle-$VER.zip"; do
            echo "Trying $URL"
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 -o "$ZIP" "$URL"; then
              GOT=1; break
            fi
          done
          test "$GOT" = 1 || { echo 'all Gradle mirrors failed'; exit 1; }
          ls -lh "$ZIP"
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$ZIP|" "$WRAP"
          echo '--- resulting wrapper config ---'
          cat "$WRAP"
          grep -q 'file:///tmp/gradle-' "$WRAP" || { echo 'rewrite failed'; exit 1; }
      - name: Apply Android permissions and disable backup
        run: |
          python3 tools/prepare_platforms.py
          # Flutter create may add a template test for a non-existent MyApp.
          rm -f test/widget_test.dart
      - name: Restore stable signing identity
        env:
          XY_RELEASE_SIGNING_BUNDLE: ${{ secrets.XY_RELEASE_SIGNING_BUNDLE }}
        run: python3 tools/unpack_release_signing.py
      - name: Configure Android release signing
        run: python3 tools/configure_release_signing.py
      - name: Fetch offline speech recognition model
        run: |
          # icefall-asr-zipformer-streaming-wenetspeech-20230615 (int8 streaming, zh)
          # Primary: GitHub release tar. Fallback: per-file HuggingFace mirror
          # of the same model (same files, same layout). -f never saves an
          # HTTP error page as the archive.
          set -e
          mkdir -p assets/sherpa
          GH_TAR=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/icefall-asr-zipformer-streaming-wenetspeech-20230615.tar.bz2
          HF_BASE=https://huggingface.co/pkufool/icefall-asr-zipformer-streaming-wenetspeech-20230615/resolve/main
          if curl -fL --retry 2 --retry-delay 5 --connect-timeout 20 -o /tmp/asr.tar.bz2 "$GH_TAR" \
             && tar -xjf /tmp/asr.tar.bz2 -C /tmp; then
            cp /tmp/icefall-asr-zipformer-streaming-wenetspeech-20230615/exp/encoder-epoch-12-avg-4-chunk-16-left-128.int8.onnx assets/sherpa/
            cp /tmp/icefall-asr-zipformer-streaming-wenetspeech-20230615/exp/decoder-epoch-12-avg-4-chunk-16-left-128.onnx assets/sherpa/
            cp /tmp/icefall-asr-zipformer-streaming-wenetspeech-20230615/exp/joiner-epoch-12-avg-4-chunk-16-left-128.onnx assets/sherpa/
            cp /tmp/icefall-asr-zipformer-streaming-wenetspeech-20230615/data/lang_char/tokens.txt assets/sherpa/
            rm -f /tmp/asr.tar.bz2
            rm -rf /tmp/icefall-asr-zipformer-streaming-wenetspeech-20230615
          else
            echo "GitHub release download failed; falling back to HuggingFace"
            curl -fL --retry 3 --retry-delay 5 -o assets/sherpa/encoder-epoch-12-avg-4-chunk-16-left-128.int8.onnx "$HF_BASE/exp/encoder-epoch-12-avg-4-chunk-16-left-128.int8.onnx"
            curl -fL --retry 3 --retry-delay 5 -o assets/sherpa/decoder-epoch-12-avg-4-chunk-16-left-128.onnx "$HF_BASE/exp/decoder-epoch-12-avg-4-chunk-16-left-128.onnx"
            curl -fL --retry 3 --retry-delay 5 -o assets/sherpa/joiner-epoch-12-avg-4-chunk-16-left-128.onnx "$HF_BASE/exp/joiner-epoch-12-avg-4-chunk-16-left-128.onnx"
            curl -fL --retry 3 --retry-delay 5 -o assets/sherpa/tokens.txt "$HF_BASE/data/lang_char/tokens.txt"
          fi
          ls -lh assets/sherpa/
          df -h /
      - name: Install dependencies
        run: flutter pub get
      - name: Check Flutter and Dart
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build real release APK
        # arm64-only: real phones since 2018 are all arm64; skipping the
        # other ABIs halves the native-lib intermediates (disk) and the APK.
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify resulting package
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Make APK available for download
        uses: actions/upload-artifact@v7
        with:
          name: XinyuOS-v3.7-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      # Public release asset: no login needed, mirror-friendly, phone browsers
      # can download and install directly. Runs on the same commit's tag.
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5.0-b${{ github.run_number }}
          name: 小雨机 4.5.0 构建 ${{ github.run_number }}
          body: 正式签名 APK（小雨机 V4.5.0：连续对话免按钮模式+打断；数字人照片说话时嘴部律动、头部轻摆）。覆盖安装即可（不要卸载）。对应提交 ${{ github.sha }}。
          files: build/app/outputs/flutter-apk/app-release.apk
